<!doctype html>
<html lang="PT-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Game</title>
  </head>
  <body class="containerGame">
    <header>
      <h1 class="titleGame">jogo da memoria</h1>
    </header>
    <main>
      <div class="containerPrincipal">
        <div class="containerPlayer1">
          <div class="player">P1</div>

          <div class="separar">
            <div class="Nome">nome</div>
            <div class="score">score</div>
          </div>
        </div>
        <div class="timer">
          <div class="time">tempo</div>
          <div class="vezJogada">vez do player1</div>
        </div>
        <div class="containerPlayer2">
          <div class="player">P2</div>
          <div class="separar">
            <div class="Nome">nome</div>
            <div class="score">score</div>
          </div>
        </div>
      </div>

      <section>
        <div id="container" class="container"></div>
      </section>
    </main>

    <script>
      const colors = [
        "azul",
        "branco",
        "verde",
        "amarelo",
        "lilas",
        "roxo",
        "rosa",
        "laranja",
        "azul",
        "branco",
        "verde",
        "amarelo",
        "lilas",
        "roxo",
        "rosa",
        "laranja",
      ];
      const container = document.querySelector("#container");
      for (let i = 0; i < colors.length; i++) {
        const novaDiv = document.createElement("div");
        novaDiv.textContent = "game";
        container.appendChild(novaDiv);
      }
    </script>
  </body>
</html>
